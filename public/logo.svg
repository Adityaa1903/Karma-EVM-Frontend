<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="karmaVioletGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="karmaSilverGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="karmaGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon
    points="256,24 456,139 456,373 256,488 56,373 56,139"
    fill="#0f0f13"
    stroke="url(#karmaVioletGrad)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Inset Geometry -->
  <polygon
    points="256,46 436,150 436,362 256,466 76,362 76,150"
    fill="none"
    stroke="#8b5cf6"
    stroke-width="2"
    stroke-opacity="0.3"
  />

  <!-- Upper Arc / Upward Bull Wave (Ascending Cycle) -->
  <path
    d="M160 270 C160 190, 220 140, 280 140 C340 140, 370 190, 370 230 C370 280, 310 320, 256 350 C210 320, 160 270, 160 270 Z"
    fill="url(#karmaVioletGrad)"
    opacity="0.95"
  />

  <!-- Lower Harmonic Loop / Neutral Equilibrium Counter-Wave -->
  <path
    d="M352 242 C352 322, 292 372, 232 372 C172 372, 142 322, 142 282 C142 232, 202 192, 256 162 C302 192, 352 242, 352 242 Z"
    fill="url(#karmaSilverGrad)"
    opacity="0.9"
  />

  <!-- Central Equilibrium Core (The Eye of Dharma / Truth) -->
  <circle cx="256" cy="256" r="28" fill="#0f0f13" stroke="url(#karmaVioletGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="10" fill="#a855f7" />

  <!-- Harmonic Orbit Accents -->
  <circle cx="210" cy="184" r="5" fill="#e2e8f0" />
  <circle cx="302" cy="328" r="5" fill="#a855f7" />
</svg>
